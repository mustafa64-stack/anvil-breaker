<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="clockBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="70%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <!-- Chrome / Titanium Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 15-Minute Critical Quadrant Arc -->
    <linearGradient id="arc15Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Forged Steel Anvil Gradient -->
    <linearGradient id="anvilBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Fractured Right Half Steel -->
    <linearGradient id="anvilRight" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Kinetic Energy / Fracture Blast -->
    <linearGradient id="breakGlow" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="anvilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Plate -->
  <rect width="512" height="512" rx="104" fill="#080c14" />

  <!-- Outer Watch Bezel -->
  <circle cx="256" cy="256" r="216" fill="url(#clockBg)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Dial Sub-ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8" />

  <!-- 15-Minute Protocol Sector (12 to 3 o'clock = 0 to 90 deg) -->
  <path d="M 256 256 L 256 64 A 192 192 0 0 1 448 256 Z" fill="url(#arc15Grad)" fill-opacity="0.12" />
  <!-- Highlighted 15-min Arc Perimeter -->
  <path d="M 256 64 A 192 192 0 0 1 448 256" fill="none" stroke="url(#arc15Grad)" stroke-width="6" stroke-linecap="round" />

  <!-- Chronometer Tick Marks (Hour & Minute Indices) -->
  <g stroke="#475569" stroke-linecap="round" opacity="0.75">
    <!-- 12 o'clock -->
    <line x1="256" y1="72" x2="256" y2="92" stroke="#f59e0b" stroke-width="5" />
    <!-- 1 o'clock (30 deg) -->
    <line x1="352" y1="97" x2="342" y2="114" stroke="#f59e0b" stroke-width="3" />
    <!-- 2 o'clock (60 deg) -->
    <line x1="415" y1="160" x2="398" y2="170" stroke="#f59e0b" stroke-width="3" />
    <!-- 3 o'clock (90 deg - 15 min cap!) -->
    <line x1="440" y1="256" x2="420" y2="256" stroke="#ef4444" stroke-width="5" />
    <!-- 4 o'clock -->
    <line x1="415" y1="352" x2="398" y2="342" stroke-width="3" />
    <!-- 5 o'clock -->
    <line x1="352" y1="415" x2="342" y2="398" stroke-width="3" />
    <!-- 6 o'clock -->
    <line x1="256" y1="440" x2="256" y2="420" stroke-width="4" />
    <!-- 7 o'clock -->
    <line x1="160" y1="415" x2="170" y2="398" stroke-width="3" />
    <!-- 8 o'clock -->
    <line x1="97" y1="352" x2="114" y2="342" stroke-width="3" />
    <!-- 9 o'clock -->
    <line x1="72" y1="256" x2="92" y2="256" stroke-width="4" />
    <!-- 10 o'clock -->
    <line x1="97" y1="160" x2="114" y2="170" stroke-width="3" />
    <!-- 11 o'clock -->
    <line x1="160" y1="97" x2="170" y2="114" stroke-width="3" />
  </g>

  <!-- 15-Minute Target Marker Label -->
  <text x="432" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f59e0b" text-anchor="end" letter-spacing="1">15M</text>

  <!-- Elegant Chrono Hands in Background Behind Anvil -->
  <g opacity="0.6">
    <!-- Hour Hand pointing towards 12 -->
    <line x1="256" y1="256" x2="256" y2="140" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <!-- Minute Hand ticking sharply towards 15-Minute mark (3 o'clock) -->
    <line x1="256" y1="256" x2="410" y2="256" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central Fracture Glow aura -->
  <circle cx="260" cy="270" r="50" fill="url(#breakGlow)" opacity="0.3" filter="url(#coreGlow)" />

  <!-- ==================== THE SHATTERING ANVIL ==================== -->
  <g filter="url(#anvilShadow)">
    <!-- LEFT HALF OF ANVIL (Tilted Left slightly as it fractures) -->
    <g transform="translate(-10, 4) rotate(-3 230 290)">
      <!-- Left Anvil Body & Horn -->
      <path d="
        M 104 220
        C 125 220, 160 224, 185 226
        L 252 226
        L 248 248
        L 256 264
        L 242 278
        L 252 296
        L 238 318
        L 246 332
        L 220 340
        L 165 348
        L 140 376
        L 242 376
        L 236 394
        L 125 394
        C 120 380, 130 365, 145 354
        L 155 336
        C 140 326, 126 308, 120 286
        C 114 262, 105 244, 88 238
        L 88 226
        C 94 224, 99 220, 104 220
        Z
      " fill="url(#anvilBody)" stroke="#64748b" stroke-width="2" />

      <!-- Left Face Highlight -->
      <path d="M 104 222 L 250 227 L 246 233 L 110 228 Z" fill="#cbd5e1" opacity="0.6" />
    </g>

    <!-- RIGHT HALF OF ANVIL (Shattered, Tilted Right, Displaced Upwards & Outwards) -->
    <g transform="translate(14, -6) rotate(4 290 280)">
      <!-- Right Anvil Body & Heel/Step -->
      <path d="
        M 268 226
        L 398 226
        C 404 226, 408 230, 408 236
        L 408 246
        L 384 250
        C 372 254, 364 266, 360 280
        C 356 296, 354 316, 364 334
        L 374 350
        C 384 362, 388 374, 382 394
        L 272 394
        L 276 376
        L 348 376
        L 332 348
        L 278 340
        L 282 328
        L 268 310
        L 280 292
        L 266 272
        L 276 252
        L 266 238
        Z
      " fill="url(#anvilRight)" stroke="#64748b" stroke-width="2" />

      <!-- Pritchel / Hardie Hole on Heel -->
      <rect x="364" y="232" width="10" height="10" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <circle cx="388" cy="237" r="4.5" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

      <!-- Right Face Highlight -->
      <path d="M 270 228 L 396 228 L 396 233 L 272 233 Z" fill="#94a3b8" opacity="0.4" />
    </g>

    <!-- Dynamic Flying Shards & Steel Fragments Breaking Loose -->
    <polygon points="256,198 266,192 262,206" fill="#f59e0b" filter="url(#coreGlow)" />
    <polygon points="274,180 284,186 278,194" fill="#94a3b8" />
    <polygon points="248,212 254,216 246,220" fill="#cbd5e1" />
    <polygon points="286,260 298,256 294,270" fill="#f59e0b" />
    <polygon points="230,302 238,308 232,316" fill="#e2e8f0" />
    <polygon points="262,352 272,346 268,362" fill="#f59e0b" />
    <polygon points="296,336 304,342 298,348" fill="#64748b" />
  </g>

  <!-- Electric Fracture Energy Seam (The Strike / Break Line) -->
  <path d="
    M 258 190
    L 254 224
    L 264 246
    L 250 268
    L 266 290
    L 248 316
    L 262 336
    L 252 368
    L 258 402
  " fill="none" stroke="url(#arc15Grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#coreGlow)" />

  <path d="
    M 258 190
    L 254 224
    L 264 246
    L 250 268
    L 266 290
    L 248 316
    L 262 336
    L 252 368
    L 258 402
  " fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Impact Sparks bursting from the fracture core -->
  <circle cx="258" cy="246" r="3" fill="#ffffff" filter="url(#coreGlow)" />
  <circle cx="265" cy="288" r="3.5" fill="#fef08a" filter="url(#coreGlow)" />
  <circle cx="250" cy="320" r="2.5" fill="#f59e0b" filter="url(#coreGlow)" />
  <circle cx="270" cy="210" r="2" fill="#f59e0b" />
  <circle cx="236" cy="275" r="2" fill="#ef4444" />
  <circle cx="280" cy="305" r="2" fill="#fef08a" />

  <!-- Subtle Bottom Brand Wordmark Accent -->
  <g transform="translate(256, 468)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#94a3b8" letter-spacing="4">ANVIL BREAKER</text>
  </g>
</svg>

