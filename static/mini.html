<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvil Breaker Mini HUD</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      -webkit-font-feature-settings: "tnum";
      font-feature-settings: "tnum";
    }
  </style>
</head>
<body class="h-screen flex flex-col justify-between p-3 box-border bg-[#090d16] border border-white/10">

  <!-- Top Bar: Problem ID, Title, Sync indicator -->
  <div class="flex items-center justify-between text-xs border-b border-white/5 pb-1.5">
    <div class="flex items-center space-x-1.5 truncate max-w-[240px]">
      <span id="prob-badge" class="px-1.5 py-0.2 rounded bg-white/10 text-amber-400 font-mono font-bold text-[10px]">#1</span>
      <span id="prob-title" class="font-semibold text-slate-200 truncate text-[11px]">Two Sum</span>
      <span id="prob-level" class="px-1 rounded text-[9px] font-bold font-mono bg-emerald-500/15 text-emerald-400">EASY</span>
    </div>

    <!-- Live Sync Status -->
    <div class="flex items-center space-x-1 text-[10px] text-emerald-400 font-mono">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      <span id="sync-label">SYNCED</span>
    </div>
  </div>

  <!-- Center: Digital Timer Display & Phase Tag -->
  <div class="flex items-center justify-between my-auto py-1">
    <div>
      <div class="flex items-baseline space-x-2">
        <span id="timer-digits" class="text-4xl font-mono font-bold tracking-tight text-white tabular-nums">15:00</span>
        <span id="phase-tag" class="text-[10px] font-mono px-1.5 py-0.5 rounded font-bold uppercase bg-surface3 text-amber-400 border border-white/10">
          P1 Read & Trace
        </span>
      </div>
      <!-- Mini Segment Progress Bar -->
      <div class="w-48 h-1 bg-white/10 rounded-full mt-1.5 overflow-hidden flex">
        <div id="bar-1" class="h-full bg-sky-400 transition-all duration-300" style="width: 20%"></div>
        <div id="bar-2" class="h-full bg-indigo-400 transition-all duration-300" style="width: 26%"></div>
        <div id="bar-3" class="h-full bg-emerald-400 transition-all duration-300" style="width: 40%"></div>
        <div id="bar-4" class="h-full bg-rose-400 transition-all duration-300" style="width: 14%"></div>
      </div>
    </div>

    <!-- Quick Play/Pause Action Button -->
    <button id="btn-toggle" class="w-10 h-10 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 flex items-center justify-center font-bold shadow transition active:scale-95 shrink-0" aria-label="Toggle Timer">
      <svg id="icon-play" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Toolbar: Reset, Next Phase, +1m, Sound, Focus Main -->
  <div class="flex items-center justify-between text-[11px] pt-1.5 border-t border-white/5">
    <div class="flex items-center space-x-1.5">
      <button id="btn-reset" class="px-2 py-0.5 rounded bg-white/5 hover:bg-white/10 text-slate-300 transition text-[11px]" title="Reset">
        Reset
      </button>
      <button id="btn-next-phase" class="px-2 py-0.5 rounded bg-white/5 hover:bg-white/10 text-slate-300 transition text-[11px]" title="Next Phase">
        Next Phase
      </button>
      <button id="btn-add-1m" class="px-2 py-0.5 rounded bg-white/5 hover:bg-white/10 text-amber-400 font-mono transition text-[11px]" title="Add 1 minute">
        +1m
      </button>
    </div>

    <div class="flex items-center space-x-1.5">
      <button id="btn-sound" class="px-1.5 py-0.5 rounded bg-white/5 hover:bg-white/10 text-slate-400 font-mono text-[10px] transition" title="Toggle Sound">
        AUDIO
      </button>
      <button id="btn-focus-main" class="px-1.5 py-0.5 rounded bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition text-[10px]" title="Focus Main Command Center">
        Main ↗
      </button>
    </div>
  </div>

  <script>
    const bc = new BroadcastChannel('dsa_mini_hud_channel');
    
    let state = {
      timerSeconds: 15 * 60,
      timerRunning: false,
      activePhase: 1,
      soundEnabled: true,
      problem: { id: 1, title: 'Two Sum', level: 'E' },
      phaseConfig: null
    };

    function renderUI() {
      const mins = Math.floor(state.timerSeconds / 60);
      const secs = state.timerSeconds % 60;
      const digitsEl = document.getElementById('timer-digits');
      digitsEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const tagEl = document.getElementById('phase-tag');
      const phases = [
        { name: "P1 Read & Trace", class: "text-sky-400 bg-sky-500/10 border-sky-500/20" },
        { name: "P2 Pattern", class: "text-indigo-400 bg-indigo-500/10 border-indigo-500/20" },
        { name: "P3 Code & Test", class: "text-emerald-400 bg-emerald-500/10 border-emerald-500/20" },
        { name: "P4 Cut Losses", class: "text-rose-400 bg-rose-500/10 border-rose-500/20" }
      ];
      const cur = phases[state.activePhase - 1] || phases[0];
      tagEl.className = `text-[10px] font-mono px-1.5 py-0.5 rounded font-bold uppercase border ${cur.class}`;
      tagEl.textContent = cur.name;

      if (state.problem) {
        document.getElementById('prob-badge').textContent = `#${state.problem.id}`;
        document.getElementById('prob-title').textContent = state.problem.title;
        const lvlEl = document.getElementById('prob-level');
        const lvl = state.problem.level || 'M';
        if (lvl === 'E') {
          lvlEl.textContent = 'EASY';
          lvlEl.className = 'px-1 rounded text-[9px] font-bold font-mono bg-emerald-500/15 text-emerald-400';
        } else if (lvl === 'M') {
          lvlEl.textContent = 'MED';
          lvlEl.className = 'px-1 rounded text-[9px] font-bold font-mono bg-amber-500/15 text-amber-400';
        } else {
          lvlEl.textContent = 'HARD';
          lvlEl.className = 'px-1 rounded text-[9px] font-bold font-mono bg-rose-500/15 text-rose-400';
        }
      }

      const btnToggle = document.getElementById('btn-toggle');
      const iconPlay = document.getElementById('icon-play');
      if (state.timerRunning) {
        btnToggle.className = "w-10 h-10 rounded-lg bg-surface3 hover:bg-surface4 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold shadow transition active:scale-95 shrink-0";
        iconPlay.innerHTML = `<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>`;
      } else {
        btnToggle.className = "w-10 h-10 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 flex items-center justify-center font-bold shadow transition active:scale-95 shrink-0";
        iconPlay.innerHTML = `<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>`;
      }

      document.getElementById('btn-sound').textContent = state.soundEnabled ? 'AUDIO' : 'MUTE';
    }

    bc.onmessage = (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.action === 'STATE_UPDATE') {
        state.timerSeconds = msg.timerSeconds;
        state.timerRunning = msg.timerRunning;
        state.activePhase = msg.activePhase;
        if (msg.problem) state.problem = msg.problem;
        if (msg.soundEnabled !== undefined) state.soundEnabled = msg.soundEnabled;
        if (msg.phaseConfig) state.phaseConfig = msg.phaseConfig;
        renderUI();
      }
    };

    document.getElementById('btn-toggle').addEventListener('click', () => {
      bc.postMessage({ action: 'TOGGLE_TIMER' });
      state.timerRunning = !state.timerRunning;
      renderUI();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      bc.postMessage({ action: 'RESET_TIMER' });
      renderUI();
    });

    document.getElementById('btn-next-phase').addEventListener('click', () => {
      bc.postMessage({ action: 'NEXT_PHASE' });
    });

    document.getElementById('btn-add-1m').addEventListener('click', () => {
      bc.postMessage({ action: 'ADD_TIME', minutes: 1 });
    });

    document.getElementById('btn-sound').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      bc.postMessage({ action: 'TOGGLE_SOUND', enabled: state.soundEnabled });
      renderUI();
    });

    document.getElementById('btn-focus-main').addEventListener('click', () => {
      if (window.opener && !window.opener.closed) {
        window.opener.focus();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        bc.postMessage({ action: 'TOGGLE_TIMER' });
      } else if (e.key === 'r' || e.key === 'R') {
        bc.postMessage({ action: 'RESET_TIMER' });
      } else if (e.key === '+' || e.key === '=') {
        bc.postMessage({ action: 'ADD_TIME', minutes: 1 });
      } else if (['1', '2', '3', '4'].includes(e.key)) {
        bc.postMessage({ action: 'SET_PHASE', phase: parseInt(e.key) });
      }
    });

    bc.postMessage({ action: 'REQUEST_STATE' });
  </script>
</body>
</html>
