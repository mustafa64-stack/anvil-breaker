name: CI/CD DSA Protocol Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Database and Migrate
      run: |
        python database.py

    - name: Run Backend Health & Sheet Tests
      run: |
        python -c "
        import server
        print('Testing /api/sheets...')
        sheets = server.list_sheets()
        assert len(sheets['sheets']) >= 4, 'Missing curated sheets'
        print('Testing health check...')
        health = server.health_check()
        assert health['status'] == 'healthy'
        print('All CI tests passed!')
        "

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker Container
      run: |
        docker build -t dsa-protocol-command-center .

