services:
  - type: web
    name: dsa-protocol-hub
    runtime: python
    buildCommand: pip install -r requirements.txt && python database.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
    disk:
      name: dsa-data
      mountPath: /app/data
      sizeGB: 1

