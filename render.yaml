services:
  - type: web
    name: anvil-breaker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python database.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0

