<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anvil Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 9px;
      padding: 2px 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .timer-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .timer-digits {
      font-family: monospace;
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1px;
    }
    .phase-label {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      color: #06b6d4;
      text-transform: uppercase;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: #334155; color: white; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
      margin-top: 4px;
    }
    a { color: #818cf8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-48.png" style="width: 20px; height: 20px; border-radius: 4px; vertical-align: middle;" alt="Logo">
      <span>ANVIL BREAKER</span>
    </div>
    <span class="badge" id="hud-status">HUD Injected</span>
  </div>

  <div class="timer-card">
    <div class="timer-digits" id="ext-timer-display">15:00</div>
    <div class="phase-label" id="ext-phase-display">Phase 1: Read & Trace</div>
    
    <div class="btn-row">
      <button class="btn-primary" id="btn-ext-toggle">Start Timer</button>
      <button class="btn-secondary" id="btn-ext-reset">Reset</button>
      <button class="btn-secondary" id="btn-ext-next">⏭</button>
    </div>
  </div>

  <div class="footer">
    <span>By Mustafa Marjani</span>
    <a href="http://localhost:8765" target="_blank" id="link-dashboard">Open Dashboard ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
